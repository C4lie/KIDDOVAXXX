{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Force Password Change - KiddoVax</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-[2.5rem] shadow-xl border border-slate-100 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-teal-500 to-cyan-500"></div>
        
        <div>
            <div class="mx-auto h-20 w-20 bg-teal-50 text-teal-600 rounded-full flex items-center justify-center border-4 border-teal-100 shadow-sm mb-6">
                <span class="material-symbols-outlined text-4xl">lock_reset</span>
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-slate-900">
                Security Update Required
            </h2>
            <p class="mt-2 text-center text-sm text-slate-600 font-semibold">
                Welcome to KiddoVax. For security, please change your temporary password to continue.
            </p>
        </div>

        {% if messages %}
        <div class="space-y-3">
            {% for message in messages %}
            <div class="bg-red-50 border border-red-200 text-red-800 px-4 py-3 rounded-xl flex items-center gap-3 text-sm font-semibold">
                <span class="material-symbols-outlined text-red-500">error</span>
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form class="mt-8 space-y-6" action="{% url 'patient:force_password_change' %}" method="POST">
            {% csrf_token %}
            
            <div class="space-y-4">
                <div class="space-y-1.5">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest px-1">Current Password</label>
                    <input type="password" name="current_password" required class="appearance-none rounded-xl relative block w-full px-4 py-3 border border-slate-200 placeholder-slate-400 text-slate-900 focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 focus:z-10 sm:text-sm font-semibold shadow-sm transition-all" placeholder="Enter current password">
                </div>
                
                <div class="space-y-1.5">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest px-1">New Password</label>
                    <input type="password" name="new_password" required class="appearance-none rounded-xl relative block w-full px-4 py-3 border border-slate-200 placeholder-slate-400 text-slate-900 focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 focus:z-10 sm:text-sm font-semibold shadow-sm transition-all" placeholder="Create new password">
                </div>

                <div class="space-y-1.5">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest px-1">Confirm New Password</label>
                    <input type="password" name="confirm_password" required class="appearance-none rounded-xl relative block w-full px-4 py-3 border border-slate-200 placeholder-slate-400 text-slate-900 focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500 focus:z-10 sm:text-sm font-semibold shadow-sm transition-all" placeholder="Confirm new password">
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-3.5 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-teal-600 hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <span class="material-symbols-outlined text-teal-300 group-hover:text-teal-200 transition-colors">enhanced_encryption</span>
                    </span>
                    Change Password & Continue
                </button>
            </div>
        </form>
    </div>

</body>
</html>
